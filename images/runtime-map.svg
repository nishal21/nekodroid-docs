<svg xmlns="http://www.w3.org/2000/svg" width="640" height="204" viewBox="0 0 640 204" role="img" aria-label="Runtime map: browser UI and wasm-bindgen feed two independent lanes, ARM CPU and Dalvik HLE" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="640" height="204" rx="12" fill="#0c0c0d"/><text x="24" y="34" font-size="12" fill="#9a9aa2" letter-spacing="1">TWO INDEPENDENT RUNTIMES</text><rect x="24" y="56" width="140" height="64" rx="8" fill="#16161a" stroke="#ffffff24"/><text x="94.0" y="85.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8ea">Browser UI</text><text x="94.0" y="103.0" text-anchor="middle" font-size="11" fill="#9a9aa2" font-family="'JetBrains Mono', monospace">Canvas, Audio</text><path d="M164 88H182" stroke="#5a5a62" stroke-width="1.5"/><path d="M181 84L188 88L181 92Z" fill="#5a5a62"/><rect x="188" y="56" width="140" height="64" rx="8" fill="#16161a" stroke="#ffffff24"/><text x="258.0" y="85.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8ea">wasm-bindgen</text><text x="258.0" y="103.0" text-anchor="middle" font-size="11" fill="#9a9aa2" font-family="'JetBrains Mono', monospace">JS ↔ Rust</text><path d="M328 88H352V60H370M352 88V152H370" stroke="#5a5a62" stroke-width="1.5" fill="none"/><rect x="370" y="30" width="246" height="60" rx="8" fill="#16161a" stroke="#10b981"/><text x="493.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8ea">ARM lane</text><text x="493.0" y="75.0" text-anchor="middle" font-size="11" fill="#9a9aa2" font-family="'JetBrains Mono', monospace">ARMv7 + Thumb CPU, MMIO</text><rect x="370" y="122" width="246" height="60" rx="8" fill="#16161a" stroke="#10b981"/><text x="493.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8ea">APK lane</text><text x="493.0" y="167.0" text-anchor="middle" font-size="11" fill="#9a9aa2" font-family="'JetBrains Mono', monospace">DEX → Dalvik HLE, stubs</text><text x="24" y="176" font-size="11" fill="#6e6e76">APK code never runs on the ARM CPU.</text></svg>
